name: Daily News & Trend Collection

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 한국시간(KST) 08:00 (GitHub 사정으로 10~30분 늦게 시작될 수 있음)
  workflow_dispatch:        # GitHub에서 수동으로도 실행 가능하게

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: gov-tracker   # 'gov-tracker' 환경에 등록한 Secrets도 읽을 수 있게 (저장소 Secrets도 그대로 읽힘)
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 크롬 브라우저 설치 (IRIS·NTIS·KERIS·AIHub 수집에 필수)
        run: python -m playwright install --with-deps chromium

      - name: 필수 설정 확인
        run: python check_setup.py

      - name: ① 공고 수집 + AI 분석 + 낙찰·계약
        run: python main.py

      - name: ② 뉴스·헤드라인·이슈카드 미리 만들기
        if: always()
        run: python briefing_batch.py

      - name: ③ 트렌드 키워드 분석
        if: always()
        run: python trend_batch.py

      - name: ④ 메일 알림 발송
        if: always()
        run: python alert_mailer.py
