name: Probe (일회성 조사)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: gov-tracker
    timeout-minutes: 20
    env:
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p probe_out && python tools/probe_dlvr.py 2>&1 | tee probe_out/log.txt
      - if: always()
        run: |
          cd probe_out && git init -q -b probe && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
