name: Shopping Mall Delivery Requests (쇼핑몰 납품요구 엑셀)

on:
  schedule:
    - cron: '30 15 * * *'   # 매일 00:30 (한국시간) — 하루 한도가 새로 시작된 직후. 지난 자료는 캐시로 건너뛰어 보통 수십 회로 끝남
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dlvr:
    runs-on: ubuntu-latest
    environment: gov-tracker
    timeout-minutes: 150
    env:
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl requests
      - name: 지난 실행 결과(캐시) 불러오기
        run: git fetch -q origin exports-dlvr && git show FETCH_HEAD:raw_cache.json > raw_cache.json || echo "캐시 없음"
      - name: 납품요구 수집 + 엑셀
        run: set -o pipefail; python dlvr_export.py --out dlvr.xlsx 2>&1 | tee run_log.txt
      - name: 엑셀 사본을 exports-dlvr 브랜치에 보관
        if: always()
        run: |
          mkdir -p /tmp/exp && cp run_log.txt /tmp/exp/ 2>/dev/null || true
          cp raw_cache.json /tmp/exp/ 2>/dev/null || true
          if [ -f dlvr.xlsx ]; then cp dlvr.xlsx /tmp/exp/; fi
          cd /tmp/exp && git init -q -b exports-dlvr && git add -A
          git -c user.name=gov-tracker-bot -c user.email=bot@users.noreply.github.com commit -qm "납품요구 엑셀 $(date +%F)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" exports-dlvr
